<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Deceive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      user-select: none;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
      color: #fff;
    }
    .status {
      font-size: 0.9rem;
      color: #888;
      margin-bottom: 1.5rem;
    }
    .indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4caf50;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .info {
      font-size: 0.8rem;
      color: #666;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Deceive</h1>
    <p class="status"><span class="indicator"></span>Proxy Active - Appearing Offline</p>
    <p class="info">Right-click tray icon for options.<br>Close this window to minimize to tray.</p>
  </div>
</body>
</html>
